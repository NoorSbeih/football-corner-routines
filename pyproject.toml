[project]
name = "corner-routines"
version = "0.1.0"
description = "Corner routines from StatsBomb open data: delivery, first contact, second ball."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Noor Sbeih" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "prefect>=2.19,<3",
    "pyarrow>=16",
    "pyyaml>=6",
    "statsbombpy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
corner-routines = "corner_routines.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
